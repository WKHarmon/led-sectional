name: Build Firmware

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware
        run: |
          cd firmware
          pio run -e d1_mini_lite

      - name: Prepare firmware binaries
        run: |
          # Create versioned copy for release notes
          cp firmware/.pio/build/d1_mini_lite/firmware.bin led-sectional-${{ github.ref_name }}.bin
          # Create unversioned copy for "latest" URL pattern
          cp firmware/.pio/build/d1_mini_lite/firmware.bin led-sectional.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.ref_name }}
          path: |
            led-sectional-${{ github.ref_name }}.bin
            led-sectional.bin

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            led-sectional-${{ github.ref_name }}.bin
            led-sectional.bin
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
