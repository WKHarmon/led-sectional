name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Firmware"]
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Only run if triggered directly OR if firmware build succeeded
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Download firmware from latest release
        run: |
          mkdir -p dist/firmware
          # Download firmware binary from latest release
          curl -L -o dist/firmware/led-sectional.bin \
            "https://github.com/${{ github.repository }}/releases/latest/download/led-sectional.bin" || true
          # Check if download succeeded
          if [ -f dist/firmware/led-sectional.bin ] && [ -s dist/firmware/led-sectional.bin ]; then
            echo "Firmware downloaded successfully"
            ls -la dist/firmware/
          else
            echo "Warning: Could not download firmware from release"
            rm -f dist/firmware/led-sectional.bin
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
