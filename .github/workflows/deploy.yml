name: Build and Deploy Web Config

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Firmware"]
    types:
      - completed

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Only run if triggered directly OR if firmware build succeeded
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build web app
        working-directory: web
        run: VITE_BASE_PATH=/configure/ npm run build

      - name: Download firmware from latest release
        run: |
          mkdir -p web/dist/firmware
          # Download firmware binary from latest release
          curl -L -o web/dist/firmware/led-sectional.bin \
            "https://github.com/${{ github.repository }}/releases/latest/download/led-sectional.bin" || true
          # Check if download succeeded
          if [ -f web/dist/firmware/led-sectional.bin ] && [ -s web/dist/firmware/led-sectional.bin ]; then
            echo "Firmware downloaded successfully"
            ls -la web/dist/firmware/
          else
            echo "Warning: Could not download firmware from release"
            rm -f web/dist/firmware/led-sectional.bin
          fi

      - name: Update manifest version from release tag
        run: |
          # Get the latest release tag (e.g., "v2.0.1" -> "2.0.1")
          RELEASE_TAG=$(gh release view --json tagName -q '.tagName' 2>/dev/null || echo "")
          if [ -n "$RELEASE_TAG" ]; then
            VERSION="${RELEASE_TAG#v}"  # Strip leading 'v'
            echo "Updating manifest.json version to $VERSION"
            # Update the version in manifest.json
            if [ -f web/dist/firmware/manifest.json ]; then
              sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" web/dist/firmware/manifest.json
              cat web/dist/firmware/manifest.json
            fi
          else
            echo "Warning: Could not determine release version"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update docs/configure
        run: |
          # Remove old configure files (except .gitkeep if any)
          rm -rf docs/configure/assets
          rm -f docs/configure/index.html
          rm -rf docs/configure/firmware

          # Copy new build
          cp -r web/dist/* docs/configure/

          # Ensure .nojekyll exists
          touch docs/configure/.nojekyll

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/configure/

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update web config tool

          🤖 Generated with GitHub Actions"
            git push
          fi
