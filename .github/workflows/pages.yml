name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Firmware"]
    types:
      - completed

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Only run if triggered directly OR if firmware build succeeded
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Jekyll site
        run: |
          cd docs
          # Create a Gemfile if it doesn't exist
          if [ ! -f Gemfile ]; then
            cat > Gemfile << 'EOF'
          source "https://rubygems.org"
          gem "github-pages", group: :jekyll_plugins
          gem "webrick"
          EOF
          fi
          bundle install
          bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build web config app
        working-directory: web
        run: |
          npm ci
          VITE_BASE_PATH=${{ steps.pages.outputs.base_path }}/configure/ npm run build

      - name: Download firmware from latest release
        run: |
          mkdir -p web/dist/firmware
          # Download firmware binary from latest release
          curl -L -o web/dist/firmware/led-sectional.bin \
            "https://github.com/${{ github.repository }}/releases/latest/download/led-sectional.bin" || true
          # Check if download succeeded
          if [ -f web/dist/firmware/led-sectional.bin ] && [ -s web/dist/firmware/led-sectional.bin ]; then
            echo "Firmware downloaded successfully"
            ls -la web/dist/firmware/
          else
            echo "Warning: Could not download firmware from release"
            rm -f web/dist/firmware/led-sectional.bin
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update manifest version from release tag
        run: |
          # Get the latest release tag (e.g., "v2.0.1" -> "2.0.1")
          RELEASE_TAG=$(gh release view --json tagName -q '.tagName' 2>/dev/null || echo "")
          if [ -n "$RELEASE_TAG" ]; then
            VERSION="${RELEASE_TAG#v}"  # Strip leading 'v'
            echo "Updating manifest.json version to $VERSION"
            # Update the version in manifest.json
            if [ -f web/dist/firmware/manifest.json ]; then
              sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" web/dist/firmware/manifest.json
              cat web/dist/firmware/manifest.json
            fi
          else
            echo "Warning: Could not determine release version"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Combine Jekyll site and web app
        run: |
          # Copy web app build into Jekyll output
          mkdir -p docs/_site/configure
          cp -r web/dist/* docs/_site/configure/
          # Ensure .nojekyll exists for the configure subdirectory
          touch docs/_site/configure/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
