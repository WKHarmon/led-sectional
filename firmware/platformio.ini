; PlatformIO Configuration for LED Sectional
; https://github.com/WKHarmon/led-sectional

[env:d1_mini_lite]
; Using platform 2.6.3 for Arduino Core 2.7.4 - more stable with FastLED
platform = espressif8266@2.6.3
board = d1_mini_lite
framework = arduino

; Serial monitor settings
monitor_speed = 115200

; Build flags
; FIRMWARE_VERSION is overridden by CI during tagged builds
build_flags =
    -D FASTLED_ESP8266_RAW_PIN_ORDER
    -D CONFIG_LITTLEFS_FOR_IDF_3_2
    -D FIRMWARE_VERSION=\"dev\"

; Library dependencies - pinned versions for reproducible builds
lib_deps =
    fastled/FastLED@3.7.6
    https://github.com/tzapu/WiFiManager.git#v2.0.16-rc.2
    squix78/JsonStreamingParser@1.0.5
    adafruit/Adafruit TSL2561@1.1.2
    adafruit/Adafruit Unified Sensor@1.1.15
    bblanchon/ArduinoJson@7.4.2
    knolleary/PubSubClient@2.8.0

; Filesystem for configuration storage
board_build.filesystem = littlefs

; Upload settings
upload_speed = 921600

; Extra scripts for building filesystem
extra_scripts =
    pre:extra_script.py

[env:d1_mini]
; Alternative board configuration for standard D1 Mini
; Using platform 2.6.3 for Arduino Core 2.7.4 - more stable with FastLED
platform = espressif8266@2.6.3
board = d1_mini
framework = arduino
monitor_speed = 115200
build_flags =
    -D FASTLED_ESP8266_RAW_PIN_ORDER
    -D CONFIG_LITTLEFS_FOR_IDF_3_2
    -D FIRMWARE_VERSION=\"dev\"
lib_deps =
    fastled/FastLED@3.7.6
    https://github.com/tzapu/WiFiManager.git#v2.0.16-rc.2
    squix78/JsonStreamingParser@1.0.5
    adafruit/Adafruit TSL2561@1.1.2
    adafruit/Adafruit Unified Sensor@1.1.15
    bblanchon/ArduinoJson@7.4.2
    knolleary/PubSubClient@2.8.0
board_build.filesystem = littlefs
upload_speed = 921600
